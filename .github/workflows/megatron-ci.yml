name: Megatron-LM CI

on:
  push:
    branches:
      - rocm_dev
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      docker_image_override:
        description: 'Docker image to test with (leave empty to use .github/ci_config.json)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select_image:
    name: Select Docker image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.select-image.outputs.image }}
    steps:
      - name: Checkout CI config
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/ci_config.json
          sparse-checkout-cone-mode: false

      - name: Select Docker image
        id: select-image
        env:
          BRANCH_NAME: ${{ github.base_ref || github.ref_name }}
          OVERRIDE: ${{ inputs.docker_image_override }}
        run: |
          set -euo pipefail
          # The image is prebuilt from Dockerfile_rocm.ci and published to the registry;
          # CI only pulls it. Bump the tag in .github/ci_config.json to change it.
          if jq -e --arg key "$BRANCH_NAME" '.docker_images[$key]' .github/ci_config.json > /dev/null; then
            JSON_KEY="$BRANCH_NAME"
          else
            JSON_KEY="default"
          fi
          IMAGE=$(jq -r --arg key "$JSON_KEY" '.docker_images[$key]' .github/ci_config.json)

          if [ -n "$OVERRIDE" ]; then
            echo "::notice::Manual image override: $OVERRIDE"
            IMAGE="$OVERRIDE"
          fi

          if [ -z "$IMAGE" ] || [ "$IMAGE" = "null" ]; then
            echo "::error::No Docker image configured for '$JSON_KEY' in .github/ci_config.json"
            exit 1
          fi
          echo "Using Docker image ($JSON_KEY): $IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  build_and_test:
    name: Build and Test on GPU
    needs: select_image
    timeout-minutes: 720
    runs-on: linux-megatron-mi325-8
    env:
      DOCKER_IMAGE: ${{ needs.select_image.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Print environment
        run: |
          echo "::group::Environment"
          env | sort
          echo "::endgroup::"

      - name: ROCm diagnostics (host)
        run: |
          if command -v rocm-smi >/dev/null 2>&1; then
            rocm-smi || true
          else
            echo "rocm-smi not found on runner"
          fi

      - name: Pull Docker image
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker pull "$DOCKER_IMAGE"; then
              exit 0
            fi
            echo "::warning::docker pull failed (attempt $attempt), retrying in 30s"
            sleep 30
          done
          echo "::error::Failed to pull $DOCKER_IMAGE"
          exit 1

      - name: Run unit tests in container
        run: |
          set -euxo pipefail
          DEVICE_FLAGS="$(cat /etc/podinfo/gha-render-devices 2>/dev/null || echo --device=/dev/dri)"
          test -n "$DEVICE_FLAGS"
          docker run --rm \
            --network=host \
            -u root \
            --device=/dev/kfd $DEVICE_FLAGS \
            --group-add "$(getent group render | cut -d: -f3)" \
            --group-add "$(getent group video | cut -d: -f3)" \
            --cap-add=SYS_PTRACE \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --shm-size=128G \
            -v "${{ github.workspace }}:/workspace/Megatron-LM" \
            --workdir /workspace/Megatron-LM \
            --name megatron-lm-container \
            --entrypoint /workspace/Megatron-LM/run_unit_tests.sh \
            "$DOCKER_IMAGE"

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: Megatron-LM unit tests report
          path: output/junit_report_*.xml
          reporter: java-junit
          fail-on-error: false

      - name: List test reports
        if: always()
        run: |
          echo "Workspace contents:"
          ls -R
          if [ -d output ]; then
            echo "Contents of output/:"
            ls -R output || true
          fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: megatron-lm-test-reports
          path: |
            output/unified_test_report.csv
            output/junit_report_*.xml
          if-no-files-found: ignore
          retention-days: 7