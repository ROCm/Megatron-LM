name: Megatron-LM CI

on:
  push:
    branches:
      - rocm_dev
  pull_request:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      gpu_arch:
        description: 'GPU architecture to use for build/tests (e.g. gfx942)'
        required: false
        default: 'gfx942'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Docker image
    timeout-minutes: 120
    runs-on: linux-megatron-mi325-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Print environment
        run: |
          echo "::group::Environment"
          env | sort
          echo "::endgroup::"

      - name: ROCm diagnostics (host)
        run: |
          if command -v rocm-smi >/dev/null 2>&1; then
            rocm-smi || true
          else
            echo "rocm-smi not found on runner"
          fi

      - name: Determine GPU architecture via rocminfo
        id: gpu-arch
        run: |
          set -e
          DEFAULT_ARCH="${{ github.event.inputs.gpu_arch || 'gfx942' }}"
          if command -v rocminfo >/dev/null 2>&1; then
            ARCH=$(rocminfo | grep -m 1 -oP 'gfx[0-9a-fA-F]+') || true
          else
            echo "rocminfo not found on runner, falling back to default arch"
            ARCH=""
          fi

          if [ -z "$ARCH" ]; then
            echo "Could not detect GPU arch automatically, falling back to $DEFAULT_ARCH"
            ARCH="$DEFAULT_ARCH"
          fi

          echo "Using GPU arch: $ARCH"
          echo "arch=$ARCH" >> "$GITHUB_OUTPUT"

      - name: Resolve TransformerEngine commit for branch
        id: te-ref
        run: |
          set -e
          BRANCH=release_v2.2_rocm
          SHA=$(git ls-remote https://github.com/ROCm/TransformerEngine.git "refs/heads/$BRANCH" | cut -f1)
          if [ -z "$SHA" ]; then
            echo "::error::Failed to resolve TransformerEngine commit for branch $BRANCH"
            exit 1
          fi
          echo "Using TransformerEngine commit: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image with registry cache
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile_rocm.ci
          push: true
          load: false
          tags: |
            rocm/megatron-lm-private:${{ github.sha }}
          build-args: |
            PYTORCH_ROCM_ARCH_OVERRIDE=${{ steps.gpu-arch.outputs.arch }}
            TE_COMMIT=${{ steps.te-ref.outputs.sha }}
          cache-from: |
            type=registry,ref=rocm/megatron-lm-private:cache
          cache-to: |
            type=registry,ref=rocm/megatron-lm-private:cache,mode=max

  unit_tests:
    name: Unit tests
    needs: build
    timeout-minutes: 720
    runs-on: linux-megatron-mi325-8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull Docker image
        run: docker pull rocm/megatron-lm-private:${{ github.sha }}

      - name: Run unit tests in container
        run: |
          set -euxo pipefail
          docker run --rm \
            --network=host \
            -u root \
            --device=/dev/kfd \
            --device=/dev/dri \
            --group-add "$(getent group video | cut -d: -f3)" \
            --cap-add=SYS_PTRACE \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --shm-size=128G \
            -v "${{ github.workspace }}:/workspace/Megatron-LM" \
            --workdir /workspace/Megatron-LM \
            --name megatron-lm-container \
            --entrypoint /workspace/Megatron-LM/run_unit_tests.sh \
            rocm/megatron-lm-private:${{ github.sha }}

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Megatron-LM unit tests report
          path: output/junit_report_*.xml
          reporter: java-junit
          fail-on-error: false

      - name: List test reports
        if: always()
        run: |
          echo "Workspace contents:"
          ls -R
          if [ -d output ]; then
            echo "Contents of output/:"
            ls -R output || true
          fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: megatron-lm-test-reports
          path: |
            output/unified_test_report.csv
            output/junit_report_*.xml
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup Docker image
        if: always()
        run: |
          docker image rm rocm/megatron-lm-private:${{ github.sha }} || true

  benchmarks:
    name: Benchmarks
    needs: build
    timeout-minutes: 720
    runs-on: linux-megatron-mi325-8
    continue-on-error: true
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Pull Docker image
        run: docker pull rocm/megatron-lm-private:${{ github.sha }}

      - name: Run benchmarks and generate performance report
        id: benchmarks
        run: |
          set -euxo pipefail
          mkdir -p output
          docker run --rm \
            --network=host \
            -u root \
            --device=/dev/kfd \
            --device=/dev/dri \
            --group-add "$(getent group video | cut -d: -f3)" \
            --cap-add=SYS_PTRACE \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --shm-size=128G \
            -v "${{ github.workspace }}:/workspace/Megatron-LM" \
            --workdir /workspace/Megatron-LM \
            --entrypoint /bin/bash \
            rocm/megatron-lm-private:${{ github.sha }} \
            -c "bash run_benchmarks.sh" 2>&1 | tee output/benchmark_report.txt

      - name: Display benchmark report
        if: always()
        run: |
          echo "::group::Megatron-LM Benchmark Performance Report"
          if [ -f output/benchmark_report.txt ]; then
            cat output/benchmark_report.txt
          else
            echo "Benchmark report not found (benchmarks may have been skipped or failed)"
          fi
          echo "::endgroup::"

      - name: Generate benchmark report markdown
        if: always()
        run: |
          python3 .github/scripts/benchmark-report-to-markdown.py

      - name: Publish benchmark report to Job Summary
        if: always()
        run: |
          if [ -f output/benchmark_summary.md ]; then
            cat output/benchmark_summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Publish benchmark report as Check Run
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = 'No benchmark results available.';
            if (fs.existsSync('output/benchmark_summary.md')) {
              summary = fs.readFileSync('output/benchmark_summary.md', 'utf8');
            }
            try {
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'Megatron-LM Benchmark Report',
                head_sha: context.sha,
                status: 'completed',
                conclusion: 'success',
                output: {
                  title: 'Benchmark Performance Report',
                  summary: summary
                }
              });
              core.info('Benchmark report published as Check Run');
            } catch (error) {
              core.warning('Could not create Check Run (may lack permission on forked PRs): ' + error.message);
            }

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: megatron-lm-benchmark-reports
          path: |
            output/benchmark_report.txt
            output/benchmark_report.json
            output/benchmark_results.tmp
            output/benchmark_summary.md
            output/bench_*.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Cleanup Docker image
        if: always()
        run: |
          docker image rm rocm/megatron-lm-private:${{ github.sha }} || true
