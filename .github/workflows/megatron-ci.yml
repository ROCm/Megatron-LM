# Manual TransformerEngine regression sweep through Megatron unit tests.
#
# Run from Actions → "TE release regression" → Run workflow.
# Input is a TE version (e.g. 2.12). It is normalized to the ROCm/TransformerEngine
# branch release_v<version>_rocm. That SHA is passed to Dockerfile_rocm.ci as
# TE_COMMIT, then the full unit-test suite is executed.
#
# Megatron itself is the revision you dispatch from (the selected workflow branch).
# Keep that fixed when comparing TE releases so only TE changes.
# The requested TE release is passed to Dockerfile_rocm.ci as TE_COMMIT.

name: TE release regression

on:
  pull_request:
  workflow_dispatch:
    inputs:
      docker_image_override:
        description: 'Docker image to test with (leave empty to use .github/ci_config.json)'
        required: false
        type: string

concurrency:
  # Do not cancel a different TE version running on the same Megatron ref.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.te_version }}
  cancel-in-progress: true

jobs:
  select_image:
    name: Select Docker image
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.select-image.outputs.image }}
    steps:
      - name: Checkout CI config
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/ci_config.json
          sparse-checkout-cone-mode: false

      - name: Select Docker image
        id: select-image
        env:
          BRANCH_NAME: ${{ github.base_ref || github.ref_name }}
          OVERRIDE: ${{ inputs.docker_image_override }}
        run: |
          set -euo pipefail
          # The image is prebuilt from Dockerfile_rocm.ci and published to the registry;
          # CI only pulls it. Bump the tag in .github/ci_config.json to change it.
          if jq -e --arg key "$BRANCH_NAME" '.docker_images[$key]' .github/ci_config.json > /dev/null; then
            JSON_KEY="$BRANCH_NAME"
          else
            JSON_KEY="default"
          fi
          IMAGE=$(jq -r --arg key "$JSON_KEY" '.docker_images[$key]' .github/ci_config.json)

          if [ -n "$OVERRIDE" ]; then
            echo "::notice::Manual image override: $OVERRIDE"
            IMAGE="$OVERRIDE"
          fi

          if [ -z "$IMAGE" ] || [ "$IMAGE" = "null" ]; then
            echo "::error::No Docker image configured for '$JSON_KEY' in .github/ci_config.json"
            exit 1
          fi
          echo "Using Docker image ($JSON_KEY): $IMAGE"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"

  build_and_test:
    name: Build and Test on GPU
    needs: select_image
    timeout-minutes: 720
    runs-on: linux-megatron-mi325-8
    env:
      DOCKER_IMAGE: ${{ needs.select_image.outputs.image }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Print environment
        run: |
          echo "::group::Environment"
          env | sort
          echo "::endgroup::"

      - name: ROCm diagnostics (host)
        run: |
          if command -v rocm-smi >/dev/null 2>&1; then
            rocm-smi || true
          else
            echo "rocm-smi not found on runner"
          fi

      - name: Pull Docker image
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            if docker pull "$DOCKER_IMAGE"; then
              exit 0
            fi
            echo "::warning::docker pull failed (attempt $attempt), retrying in 30s"
            sleep 30
          done
          echo "::error::Failed to pull $DOCKER_IMAGE"
          exit 1

      - name: Run unit tests in container
        run: |
          set -euxo pipefail
          DEVICE_FLAGS="$(cat /etc/podinfo/gha-render-devices 2>/dev/null || echo --device=/dev/dri)"
          test -n "$DEVICE_FLAGS"
          docker run --rm \
            --network=host \
            -u root \
            --device=/dev/kfd $DEVICE_FLAGS \
            --group-add "$(getent group render | cut -d: -f3)" \
            --group-add "$(getent group video | cut -d: -f3)" \
            --cap-add=SYS_PTRACE \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --shm-size=128G \
            -v "${{ github.workspace }}:/workspace/Megatron-LM" \
            --workdir /workspace/Megatron-LM \
            --name megatron-lm-container \
            --entrypoint /workspace/Megatron-LM/run_unit_tests.sh \
            "$DOCKER_IMAGE"

      - name: Publish test report
        if: always()
        uses: dorny/test-reporter@v3
        with:
          name: TE ${{ steps.te-ref.outputs.branch }} unit tests report
          path: output/junit_report_*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Write job summary
        if: always()
        run: |
          set -euo pipefail
          {
            echo "## TransformerEngine regression"
            echo ""
            echo "| Setting | Value |"
            echo "|---|---|"
            echo "| Megatron ref | \`${{ github.ref }}\` (\`${{ github.sha }}\`) |"
            echo "| TE input | \`${{ github.event.inputs.te_version }}\` |"
            echo "| TE branch | [\`${{ steps.te-ref.outputs.branch }}\`](https://github.com/ROCm/TransformerEngine/tree/${{ steps.te-ref.outputs.branch }}) |"
            echo "| TE SHA | [\`${{ steps.te-ref.outputs.sha }}\`](https://github.com/ROCm/TransformerEngine/commit/${{ steps.te-ref.outputs.sha }}) |"
            echo "| GPU arch | \`${{ steps.gpu-arch.outputs.arch }}\` |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY" || true
          import glob
          import os
          import xml.etree.ElementTree as ET

          files = sorted(glob.glob("output/junit_report_*.xml"))
          tests = failures = errors = skipped = 0
          failed_suites = []
          for path in files:
              try:
                  root = ET.parse(path).getroot()
              except ET.ParseError:
                  failed_suites.append(f"{os.path.basename(path)} (unparseable)")
                  continue
              suites = list(root.iter("testsuite"))
              if not suites and root.tag == "testsuite":
                  suites = [root]
              for suite in suites:
                  t = int(suite.get("tests") or 0)
                  f = int(suite.get("failures") or 0)
                  e = int(suite.get("errors") or 0)
                  s = int(suite.get("skipped") or 0)
                  tests += t
                  failures += f
                  errors += e
                  skipped += s
                  if f or e:
                      failed_suites.append(
                          f"{os.path.basename(path)} (failures={f}, errors={e})"
                      )

          print("### Results")
          print("")
          print("| Metric | Count |")
          print("|---|---|")
          print(f"| JUnit files | {len(files)} |")
          print(f"| Tests | {tests} |")
          print(f"| Failures | {failures} |")
          print(f"| Errors | {errors} |")
          print(f"| Skipped | {skipped} |")
          print("")
          if failed_suites:
              print("### Failed suites")
              print("")
              for name in failed_suites:
                  print(f"- `{name}`")
              print("")
          PY

      - name: List test reports
        if: always()
        run: |
          echo "Workspace contents:"
          ls -R
          if [ -d output ]; then
            echo "Contents of output/:"
            ls -R output || true
          fi

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: te-regression-${{ steps.te-ref.outputs.branch }}-${{ github.run_id }}
          path: |
            output/unified_test_report.csv
            output/junit_report_*.xml
          if-no-files-found: ignore
          retention-days: 7