# Manual benchmarks / profiling only — does not run unit tests.
# Single runner job: build image locally (no final image push / no image tar artifacts).
# Read-only registry layer cache (no cache-to): TE_COMMIT changes won't write new cache blobs from this workflow.
# Actions → "Megatron-LM benchmarks (manual)" → Run workflow

name: Megatron-LM benchmarks (manual)

on:
  workflow_dispatch:
    inputs:
      gpu_arch:
        description: 'GPU architecture for the Docker build (e.g. gfx942) if not detected'
        required: false
        default: 'gfx942'
      te_branch:
        description: 'ROCm/TransformerEngine.git branch used to resolve TE_COMMIT build-arg'
        required: false
        default: 'release_v2.10_rocm'
        type: string
      benchmark_preset:
        description: 'Named benchmark matrix (see run_benchmarks.sh). LLAMA FSDP = llama_fsdp (70B FSDP+recompute).'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - llama
          - deepseek
          - llama_fsdp
          - llama_8b
          - llama_70b
          - deepseek_v2
          - deepseek_v3
      total_iters:
        description: 'Training iterations per benchmark row (TOTAL_ITERS / TRAIN_ITERS)'
        required: false
        default: '12'
        type: string
      generate_benchmark_charts:
        description: 'Emit memory_footprint + perf_breakdown PNG/JSON under output/'
        required: false
        default: false
        type: boolean
      run_te_profile:
        description: 'After benchmarks, run TE E2E profiler (run_profile_ci.sh)'
        required: false
        default: false
        type: boolean

concurrency:
  group: megatron-benchmarks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Build image and run benchmarks
    runs-on: linux-megatron-mi325-8
    timeout-minutes: 1000
    continue-on-error: false
    permissions:
      contents: read
      checks: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Print environment
        run: |
          echo "::group::Environment"
          env | sort
          echo "::endgroup::"

      - name: ROCm diagnostics (host)
        run: |
          if command -v rocm-smi >/dev/null 2>&1; then
            rocm-smi || true
          else
            echo "rocm-smi not found on runner"
          fi

      - name: Determine GPU architecture via rocminfo
        id: gpu-arch
        run: |
          set -e
          DEFAULT_ARCH="${{ inputs.gpu_arch }}"
          if command -v rocminfo >/dev/null 2>&1; then
            ARCH=$(rocminfo | grep -m 1 -oP 'gfx[0-9a-fA-F]+') || true
          else
            echo "rocminfo not found on runner, falling back to default arch"
            ARCH=""
          fi

          if [ -z "$ARCH" ]; then
            echo "Could not detect GPU arch automatically, falling back to $DEFAULT_ARCH"
            ARCH="$DEFAULT_ARCH"
          fi

          echo "Using GPU arch: $ARCH"
          echo "arch=$ARCH" >> "$GITHUB_OUTPUT"

      - name: Resolve TransformerEngine commit for branch
        id: te-ref
        env:
          TE_BRANCH: ${{ inputs.te_branch }}
        run: |
          set -e
          BRANCH="${TE_BRANCH:-release_v2.10_rocm}"
          SHA=$(git ls-remote https://github.com/ROCm/TransformerEngine.git "refs/heads/$BRANCH" | cut -f1)
          if [ -z "$SHA" ]; then
            echo "::error::Failed to resolve TransformerEngine commit for branch $BRANCH"
            exit 1
          fi
          echo "Using TransformerEngine branch $BRANCH commit: $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (local only, read-only registry cache)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile_rocm.ci
          push: false
          load: true
          tags: |
            rocm/megatron-lm-private:${{ github.sha }}
          build-args: |
            PYTORCH_ROCM_ARCH_OVERRIDE=${{ steps.gpu-arch.outputs.arch }}
            TE_COMMIT=${{ steps.te-ref.outputs.sha }}
          cache-from: |
            type=registry,ref=rocm/megatron-lm-private:cache

      - name: Run benchmarks and generate performance report
        id: benchmarks
        continue-on-error: true
        env:
          GENERATE_BENCHMARK_CHARTS: ${{ inputs.generate_benchmark_charts && '1' || '0' }}
          BENCHMARK_PRESET: ${{ inputs.benchmark_preset }}
          TOTAL_ITERS: ${{ inputs.total_iters }}
          TRAIN_ITERS: ${{ inputs.total_iters }}
        run: |
          set -euxo pipefail
          mkdir -p output
          docker run --rm \
            --network=host \
            -u root \
            --device=/dev/kfd \
            --device=/dev/dri \
            --group-add "$(getent group video | cut -d: -f3)" \
            --cap-add=SYS_PTRACE \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --shm-size=128G \
            -e GENERATE_BENCHMARK_CHARTS="${GENERATE_BENCHMARK_CHARTS:-0}" \
            -e BENCHMARK_PRESET="${BENCHMARK_PRESET}" \
            -e TOTAL_ITERS="${TOTAL_ITERS:-12}" \
            -e TRAIN_ITERS="${TRAIN_ITERS:-12}" \
            -v "${{ github.workspace }}:/workspace/Megatron-LM" \
            --workdir /workspace/Megatron-LM \
            --entrypoint /bin/bash \
            rocm/megatron-lm-private:${{ github.sha }} \
            -c "bash run_benchmarks.sh" 2>&1 | tee output/benchmark_report.txt

      - name: Display benchmark report
        if: always()
        run: |
          echo "::group::Megatron-LM Benchmark Performance Report"
          if [ -f output/benchmark_report.txt ]; then
            cat output/benchmark_report.txt
          else
            echo "Benchmark report not found (benchmarks may have been skipped or failed)"
          fi
          echo "::endgroup::"

      - name: Generate benchmark report markdown
        if: always()
        run: |
          python3 .github/scripts/benchmark-report-to-markdown.py

      - name: Publish benchmark report to Job Summary
        if: always()
        run: |
          if [ -f output/benchmark_summary.md ]; then
            cat output/benchmark_summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Publish benchmark report as Check Run
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let summary = 'No benchmark results available.';
            if (fs.existsSync('output/benchmark_summary.md')) {
              summary = fs.readFileSync('output/benchmark_summary.md', 'utf8');
            }
            try {
              await github.rest.checks.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                name: 'Megatron-LM Benchmark Report (manual)',
                head_sha: context.sha,
                status: 'completed',
                conclusion: 'success',
                output: {
                  title: 'Benchmark Performance Report',
                  summary: summary
                }
              });
              core.info('Benchmark report published as Check Run');
            } catch (error) {
              core.warning('Could not create Check Run (may lack permission on forked PRs): ' + error.message);
            }

      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: megatron-lm-benchmark-reports-manual
          path: |
            output/benchmark_report.txt
            output/benchmark_report.json
            output/benchmark_results.tmp
            output/benchmark_summary.md
            output/bench_*.log
            output/memory_footprint.json
            output/memory_footprint.png
            output/perf_breakdown.json
            output/perf_breakdown.png
            output/perf_breakdown_table.md
            output/perf_breakdown_non_compute.png
            output/profiler_trace_summary.txt
            output/nccl_summary.csv
            output/tracelens_bench/**
            output/tracelens/**
            output/*.xlsx
          if-no-files-found: ignore
          retention-days: 7

      - name: Run TE profile CI script
        if: ${{ inputs.run_te_profile }}
        continue-on-error: true
        run: |
          set -euxo pipefail
          mkdir -p output
          docker run --rm \
            --network=host \
            -u root \
            --device=/dev/kfd \
            --device=/dev/dri \
            --group-add "$(getent group video | cut -d: -f3)" \
            --cap-add=SYS_PTRACE \
            --security-opt seccomp=unconfined \
            --security-opt apparmor=unconfined \
            --shm-size=128G \
            -v "${{ github.workspace }}:/workspace/Megatron-LM" \
            --workdir /workspace/Megatron-LM \
            --entrypoint /bin/bash \
            rocm/megatron-lm-private:${{ github.sha }} \
            -c "bash run_profile_ci.sh" 2>&1 | tee output/te_profile_ci.log

      - name: Upload TE profile artifacts
        if: ${{ always() && inputs.run_te_profile }}
        uses: actions/upload-artifact@v4
        with:
          name: megatron-lm-te-profile-manual
          path: |
            output/te_profile_run/**
            output/te_profile_ci.log
          if-no-files-found: ignore
          retention-days: 7

      - name: Add TE profile summary
        if: ${{ always() && inputs.run_te_profile }}
        run: |
          if [ -f output/te_profile_ci.log ]; then
            echo "## TE E2E profile run" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
            tail -n 80 output/te_profile_ci.log >> "$GITHUB_STEP_SUMMARY" || true
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Remove local Docker image
        if: always()
        run: |
          docker image rm rocm/megatron-lm-private:${{ github.sha }} || true
