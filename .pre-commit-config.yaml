repos:
- repo: https://github.com/psf/black
  rev: 'refs/tags/24.4.2:refs/tags/24.4.2'
  hooks:
  - id: black
    files: ^megatron/core/.*|^tests/unit_tests/.*
    args: ["--skip-magic-trailing-comma", "--skip-string-normalization"]
- repo: https://github.com/pycqa/pylint
  rev: v3.2.6
  hooks:
  - id: pylint
    files: ^megatron/core/.*
- repo: https://github.com/pycqa/isort
  rev: 5.13.2
  hooks:
  - id: isort
    files: ^megatron/core/.*

# --- Kimi K3 (kimi_k3/) ---------------------------------------------------
# The guard is what keeps kimi_k3/ fork-local so IFU merges never conflict with
# it (kimi_k3/develop/rules/rule.md R2.1). A maintainer enables these by running
# `pre-commit install`; the hook itself needs no arguments.
- repo: local
  hooks:
  - id: kimi-k3-no-core-diff
    name: "kimi-k3: no changes outside kimi_k3/"
    entry: kimi_k3/ci/no_core_diff_guard.sh --staged
    language: system
    pass_filenames: false
    always_run: true
